[package]
name = "podlib"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Domain model and firmware-safe backend for managing music libraries on USB-connected iPods (Nano 7G and classic click-wheel)"
readme = "../../README.md"

[dependencies]
libopod = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
plist = { workspace = true }
# Companion media-kind query over the same Library.itdb (see
# `hidden_items` in the libopod adapter); version and bundled feature
# match the vendored libopod so one SQLite build serves both.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
# Direct staged-iTunesCDB inspection in fixture_tests (M1): zlib payload
# decode + mhip walk. Same pin as the vendored libopod so one flate2
# build serves both.
flate2 = "1.1.9"
