# Release: builds podlib (CLI) + podlib-gui and uploads tarballs to GitHub
# Releases on a v* tag push. The release is created by create-gh-release-action;
# upload-rust-binary-action only attaches assets to an existing release.
#
# Asset naming CONTRACT with cargo-binstall (do not rename!): every target
# produces `podlib-<target>.tar.gz` (+ .sha256) — it must stay byte-identical
# to the `[package.metadata.binstall]` pkg-url template in both
# crates/podlib-cli/Cargo.toml and crates/podlib-gui/Cargo.toml
# (`podlib-{ target }.tar.gz`), or `cargo binstall` stops finding the archive.
#
# NOTE: this workflow runs for the first time on the first v* tag — verify the
# produced assets on that Release page (see docs/tasks packaging checklist).
name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # re-run uploads/publish without retagging

jobs:
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md # release notes = the tag's changelog section

  upload-assets:
    # skipped create-release (workflow_dispatch rerun: release already exists)
    # must not skip the dependent job
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      matrix:
        include:
          # x86_64 gnu: native build on the ubuntu runner (default toolchain).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # aarch64 musl: static binary — no glibc version constraints, best
          # portability for a distribution binary.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload assets to the GitHub Release
    steps:
      - uses: actions/checkout@v6
      # Cross linker for the bundled C code (vendored libopod + bundled
      # SQLite) when targeting aarch64-musl; x86_64 gnu builds natively
      # without it.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
        if: matrix.target == 'aarch64-unknown-linux-musl'
      # Multi-bin is valid here: the root manifest is a virtual workspace.
      # `archive` must be explicit with >1 bin ($bin default is forbidden).
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: podlib,podlib-gui
          archive: podlib-${{ matrix.target }} # binstall contract, see header
          target: ${{ matrix.target }}
          tar: unix
          zip: none
          checksum: sha256

  publish:
    name: Publish to crates.io
    needs: upload-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish (dependency order, index-propagation retries)
        # skipped (not failed) until the CARGO_REGISTRY_TOKEN secret is set
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          publish_with_retry() {
            local crate="$1"
            for attempt in 1 2 3 4 5; do
              if cargo publish --locked -p "$crate"; then
                echo "::notice::$crate published"
                sleep 20 # index propagation before the dependent crate
                return 0
              fi
              echo "::warning::$crate attempt $attempt failed — retrying in 30s"
              sleep 30
            done
            echo "::error::$crate failed to publish after 5 attempts"
            return 1
          }
          # podlib-libopod first: podlib resolves it from the registry.
          publish_with_retry podlib-libopod
          publish_with_retry podlib
          publish_with_retry podlib-cli
          publish_with_retry podlib-gui

      - name: Notice (secret not set)
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set — skipped crates.io publish"
