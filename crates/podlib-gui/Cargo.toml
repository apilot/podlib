[package]
name = "podlib-gui"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "GUI for managing music libraries on USB-connected iPods (Nano 7G and classic click-wheel), built with egui/eframe"
readme = "../../README.md"

[[bin]]
name = "podlib-gui"
path = "src/main.rs"

# Same cargo-binstall metadata as podlib-cli: both binaries ship in ONE
# archive per target (podlib-{target}.tar.gz) — one release, both binaries.
# Must stay in sync with crates/podlib-cli/Cargo.toml and the `archive:` name
# in .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/podlib-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }" # binaries at the archive root
pkg-fmt = "tgz"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
podlib = { path = "../podlib", version = "0.1.0" }
tempfile = { workspace = true } # transcode batch tempdir (worker, round 5.2)
