[workspace]
resolver = "2"
members = ["crates/podlib", "crates/podlib-cli", "crates/podlib-gui"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
# Used by [package.metadata.binstall] `{ repo }` template in podlib-cli and
# podlib-gui: binstall resolves download URLs from the repository field,
# so it must be set on every published crate with binstall metadata.
repository = "https://github.com/apilot/podlib"
# 1.95 is the MSRV gate: eframe/egui 0.37 requires 1.95 (edition 2024
# toolchain features), and slice::as_chunks::<N> (1.88) stays covered.
# Older toolchains must fail at build time with a clear message instead
# of a missing-API error.
rust-version = "1.95"

[workspace.dependencies]
# Vendored copy of github.com/koriwi/libopod @ rev 0eef69a2730aea6e9b8eb6a9b39c95deac05163d:
# crates.io 0.1.0 lacks playlist mutations and classic-device support that the
# adapter depends on. Database-layer fixes (NULL-safe rank queries against real
# firmware DBs, orphan-artist delete guard, empty-key reindex) are merged
# upstream (koriwi/libopod#1); podlib-specific edit-session fixes stay local.
# Switch back to the upstream crate once a crates.io release carries playlists.
libopod = { package = "libopod-rs", path = "crates/vendor/libopod" }
thiserror = "2"
tempfile = "3"
plist = "1.7"
# eframe/egui ecosystem releases in lockstep — keep all egui-family deps
# on the same 0.37 line. wgpu is the default renderer since 0.34.
eframe = "0.37"
# TableBuilder for the track table (round 4 UX revision). Underscore
# name: the ustc mirror does not resolve the dashed alias.
egui_extras = "0.37"

[profile.dev]
# Bundled SQLite (via libopod) optimizes poorly at O0 and slows test loops.
opt-level = 1
